name: Create AWS ECR repository
description: Creates AWS ECR repository if not available
branding:
  icon: sun
  color: red
inputs:
  ecr-name:
    description: >
      Name of the repository.
      If not provided, the current git repository name is used.
    required: false
  pull-account-ids:
    description: >
      AWS Account Ids with access to pull images.
      If not provided, no cross account policy is created.
      Ignored when allow-org-pull is true.
    required: false
  allow-org-pull:
    description: >
      If true, grants pull access to all principals in the AWS Organization
      instead of enumerating pull-account-ids. Mutually exclusive with pull-account-ids.
    required: false
    default: 'false'
  org-id:
    description: >
      AWS Organization ID used when allow-org-pull is true (e.g. o-0xh5ns90gb).
      Required when allow-org-pull is true.
    required: false
outputs:
  ecr-name:
    description: The name of the ECR repository. Same as `ecr-name` in inputs.
  ecr-arn:
    description: The ARN of the ECR repository.
  ecr-uri:
    description: The URI of the ECR repository.
runs:
  using: node16
  main: lib/index.js
